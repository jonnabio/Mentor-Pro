# Active Guards (add new guards below)
# ------------------------------------

  - id: RCA-002
    title: "Math proof accepted without establishing what the question asks"
    severity: high
    created: 2026-10-23
    rca_file: docs/rca/RCA-002-math-proof-not-establishing-question.md

    # A proof may only skip the blind solve if it establishes what is asked.
    guarded_files:
      - .ace/skills/question-quality-review/scripts/item_checker.py
      - app/generation/pipeline.py

    invariants:
      - "math_proven is false when the stimulus or stem states a number property"
      - "select: min|max proves a key only for a stem asking that extreme without further conditions"
      - "An unproven maths item is accepted only with an agreeing independent blind solve"

    tests:
      - tests/ace/test_item_checker.py
      - tests/app/test_generation.py

    standard_rule: ".ace/skills/question-quality-review/SKILL.md M04"

    review_triggers:
      - "Changes to check_math, _unproven_reason or the cue lists"
      - "New proof types in subject_checks.math"

  - id: RCA-003
    title: "Dashboard button ignored before subjects load; gate failures without evidence"
    severity: medium
    created: 2026-10-24
    rca_file: docs/rca/RCA-003-intermittent-gate-and-browser-failures.md

    guarded_files:
      - app/static/app.js
      - .ace/scripts/verify.sh

    invariants:
      - "Main-menu handlers work before asynchronous content (subjects) has loaded"
      - "verify.sh keeps stdout, stderr, exit code and duration of every gate in a log directory"
      - "A gate that exits 0 without output, or is killed by a signal, is a failure"
      - "The last line is always VERIFY_RESULT=pass|fail gate=<name>"

    tests:
      - tests/ace/test_verify_gate.py
      - scripts/dev/practice_e2e.py (scenario_dashboard_before_subjects_load)

    standard_rule: "RCA-003 Lessons Learned"

    review_triggers:
      - "New UI handlers reading form controls created after a fetch"
      - "Changes to run_gate or the verify output contract"

  - id: RCA-004
    title: "Writing exercise reviewed by the model that generated it"
    severity: medium
    created: 2026-10-25
    rca_file: docs/rca/RCA-004-writing-review-not-independent.md

    guarded_files:
      - app/writing/generation.py
      - app/writing/editing.py

    invariants:
      - "W08 fails when the reviewing model is the generating model"
      - "An exercise whose review is not independent is never stored"

    tests:
      - tests/app/test_writing_review_independence.py

    standard_rule: "ADR-020 W08 (independent review by another free model)"

    review_triggers:
      - "Changes to the review call, avoid sets or route() fallback order"
