

name: Mentor Pro CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: mentor_pro_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: mentor_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentor_pro_admin -d mentor_pro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://mentor_pro_admin:ci_test_password@127.0.0.1:5432/mentor_pro_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        run: |
          python -m pytest -q -p no:warnings tests/ace tests/curriculum tests/app

      - name: Validate ACE skills
        run: python .ace/scripts/validate_skills.py

  docker-build:
    name: Validate and Publish Docker Image
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: read
      packages: write

    env:
      CANDIDATE: mentor-pro:candidate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local Docker engine; the smoke test and the publish
      # below use this same image, never a rebuild (RCA-005).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.CANDIDATE }}

      # Publication gate (RCA-005): the container must start and answer
      # HTTP 200 on / within 60 s. Fails if it exits, never answers, or
      # answers anything else. Proves startup only, not database readiness.
      - name: Smoke test container startup
        run: |
          docker run -d --name smoke -p 127.0.0.1:8000:8000 "$CANDIDATE"
          code=000
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::container exited before answering"
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / -> HTTP $code"
          docker logs smoke
          docker rm -f smoke >/dev/null
          [ "$code" = "200" ] || { echo "::error::smoke test failed (HTTP $code)"; exit 1; }

      # T033 (ADR-031): the same image must start the tutor-only app. Test
      # credentials only. Checks, through Docker's published-port proxy like
      # production: no token -> refuses to start; allowed host not the
      # gateway -> 403; gateway allowed -> /tutor 200, API 403 without the
      # token and 200 with it; no student routes; forged forwarding refused.
      - name: Smoke test tutor entrypoint
        run: |
          set -u
          fail() { echo "::error::$1"; docker logs tutor 2>&1 | tail -20 || true; docker rm -f tutor >/dev/null 2>&1; exit 1; }
          get() { curl -s -o /dev/null -w '%{http_code}' --max-time 2 "$@" || true; }
          wait_up() {
            for _ in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Running}}' tutor)" = "true" ] || fail "tutor container exited"
              [ "$(get http://127.0.0.1:8001/tutor)" != "000" ] && return 0
              sleep 1
            done
            fail "tutor app never answered"
          }
          TOKEN="ci-test-token-$(openssl rand -hex 16)"
          rc=0; timeout 30 docker run --rm "$CANDIDATE" python -m app.tutor_main >/dev/null 2>&1 || rc=$?
          case "$rc" in 0|124) fail "tutor app did not refuse to start without a token (exit $rc)";; esac
          GW=$(docker network inspect bridge --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}')
          echo "bridge gateway: $GW"
          docker run -d --name tutor -p 127.0.0.1:8001:8000 -e MENTOR_PRO_TUTOR_TOKEN="$TOKEN"             -e MENTOR_PRO_TUTOR_ALLOWED_HOSTS=10.255.255.1 "$CANDIDATE" python -m app.tutor_main >/dev/null
          wait_up
          [ "$(get http://127.0.0.1:8001/tutor)" = "403" ] || fail "/tutor not refused for a non-allowed host"
          [ "$(get -H "X-Tutor-Token: $TOKEN" -H 'X-Forwarded-For: 10.255.255.1' http://127.0.0.1:8001/api/tutor/queue)" = "403" ]             || fail "forged X-Forwarded-For accepted"
          docker rm -f tutor >/dev/null
          docker run -d --name tutor -p 127.0.0.1:8001:8000 -e MENTOR_PRO_TUTOR_TOKEN="$TOKEN"             -e MENTOR_PRO_TUTOR_ALLOWED_HOSTS="$GW" "$CANDIDATE" python -m app.tutor_main >/dev/null
          wait_up
          [ "$(get http://127.0.0.1:8001/tutor)" = "200" ] || fail "/tutor not served to the gateway"
          [ "$(get http://127.0.0.1:8001/api/tutor/queue)" = "403" ] || fail "API answered without a token"
          [ "$(get -H 'X-Tutor-Token: wrong-token-0123456789-0123456789' http://127.0.0.1:8001/api/tutor/queue)" = "403" ]             || fail "API answered with a wrong token"
          for p in / /api/writing/levels /api/subjects /api/openapi.json /static/../main.py; do
            [ "$(get "http://127.0.0.1:8001$p")" = "404" ] || fail "tutor app serves $p"
          done
          # With the right token the API passes the boundary; no database here, so 5xx is expected, never 403.
          code=$(get -H "X-Tutor-Token: $TOKEN" http://127.0.0.1:8001/api/tutor/queue)
          case "$code" in 403|000) fail "valid token from the gateway refused (HTTP $code)";; esac
          echo "authorised request passed the boundary (HTTP $code without a database)"
          docker logs tutor 2>&1 | grep -q "$TOKEN" && fail "token appears in the logs"
          docker rm -f tutor >/dev/null
          echo "tutor entrypoint smoke test passed"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish smoke-tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for tag in testing "sha-${GITHUB_SHA}"; do
            docker tag "$CANDIDATE" "ghcr.io/jonnabio/mentor-pro:${tag}"
            docker push "ghcr.io/jonnabio/mentor-pro:${tag}"
          done
