

name: Mentor Pro CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: mentor_pro_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: mentor_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentor_pro_admin -d mentor_pro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://mentor_pro_admin:ci_test_password@127.0.0.1:5432/mentor_pro_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        run: |
          python -m pytest -q -p no:warnings tests/ace tests/curriculum tests/app

      - name: Validate ACE skills
        run: python .ace/scripts/validate_skills.py

  docker-build:
    name: Validate and Publish Docker Image
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/jonnabio/mentor-pro:testing
            ghcr.io/jonnabio/mentor-pro:sha-${{ github.sha }}
